<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>环境管理 — UTM 模拟器</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left"><h1>🛩️ UTM 模拟器控制台</h1><span class="version">utm_moc52 v3.1</span></div>
    <nav class="topbar-nav" id="top-nav"></nav>
    <div class="topbar-right"><span id="connection-dot" class="dot red"></span><span id="connection-text">未连接</span></div>
  </header>

  <main class="page-wide">
    <div class="panel panel-form">
      <h2>🔧 环境变量管理</h2>
      <div class="mode-description" style="margin-bottom:12px;">
        管理 Redis/Kafka/数据库等连接配置，支持多环境保存与一键切换。当前激活的环境将用于所有仿真操作。
      </div>

      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <button id="btn-env-new" class="btn btn-small">➕ 新建环境</button>
        <button id="btn-env-import" class="btn btn-small">📥 从 env.py 导入</button>
        <span id="env-status" style="font-size:12px;color:#82aaff;margin-left:8px;"></span>
      </div>

      <div id="env-table-container" style="max-height:400px;overflow-y:auto;">
        <table class="data-table" style="width:100%;font-size:12px;">
          <thead><tr><th>名称</th><th>Redis</th><th>Kafka</th><th>默认</th><th>操作</th></tr></thead>
          <tbody id="env-tbody"><tr><td colspan="5" class="empty-hint">功能开发中，将在 Phase 2 实现...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/env.js"></script>
  <script>initCommon('/env');</script>
</body>
</html>
