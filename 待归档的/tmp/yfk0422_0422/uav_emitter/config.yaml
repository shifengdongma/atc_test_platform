# ============================================
# UAV 数据发射器 - 全局配置
# ============================================

# Kafka 配置
kafka:
  url: "10.165.19.213:30011"
  topic: 'uav_runtime_data'

# 场景路径
scenes_path: "scenes/"

# 当前激活的场景（为空则加载所有场景）
active_scenes:
  # - "短期冲突类/告警趋势解除功能验证"
  #- "短期冲突类/水平追赶冲突"
  #- "短期冲突类/水平迎头相撞"
  # - "短期冲突类/*"      # 发送该大类下所有子场景
  # - "禁区侵入"
  - "独立测试用例"
  #- "偏离预设计划类/最低安全高度"
  #- "空域侵入类/禁区侵入类/禁区为长方体"
  #- "空域侵入类/危险区侵入类/危险区为圆柱体"

# 发射设置
emitter:
  # 发射间隔（毫秒）
  interval_ms: 1000
  
  # 时间戳处理模式
  # - preserve: 保留原始时间戳
  # - align: 对齐到当前时间，保持相对间隔
  # - replace: 替换为当前时间（默认）
  timestamp_mode: replace
  
  # 是否循环播放
  loop: false

# 日志设置
logging:
  level: INFO
  file: "logs/emitter.log"
