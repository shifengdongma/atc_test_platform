<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统日志 — UTM 模拟器</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left"><h1>🛩️ UTM 模拟器控制台</h1><span class="version">utm_moc52 v3.1</span></div>
    <nav class="topbar-nav" id="top-nav"></nav>
    <div class="topbar-right"><span id="connection-dot" class="dot red"></span><span id="connection-text">未连接</span></div>
  </header>

  <main class="dashboard-logs">
    <!-- 左侧：分类 Tab 栏 -->
    <aside class="panel panel-config" style="max-width:220px;display:flex;flex-direction:column;">
      <h2>📋 日志分类</h2>
      <div class="gen-tabs vertical" style="gap:2px;padding:6px 10px;border-bottom:none;">
        <button class="gen-tab active" data-gentab="situation-uav">🛸 监视目标</button>
        <button class="gen-tab" data-gentab="situation-plan">📋 飞行计划</button>
        <button class="gen-tab" data-gentab="situation-alarm">⚠️ 实时告警</button>
        <button class="gen-tab" data-gentab="all">📜 全部日志</button>
      </div>

      <!-- 非态势日志类型（仅"全部日志"Tab 可见） -->
      <div style="margin-top:8px;padding:6px 10px;border-top:1px solid #2a3a5c;" id="sys-log-types" class="gentab-all-only">
        <div style="font-size:10px;color:#7a93a8;margin-bottom:4px;">🔧 系统日志类型</div>
        <label class="plan-route-item" style="font-size:11px;"><input type="checkbox" class="log-type-cb" value="redis_route" checked> <span class="plan-route-uid">Redis 航线变更</span></label>
        <label class="plan-route-item" style="font-size:11px;"><input type="checkbox" class="log-type-cb" value="redis_airspace" checked> <span class="plan-route-uid">Redis 空域变更</span></label>
        <label class="plan-route-item" style="font-size:11px;"><input type="checkbox" class="log-type-cb" value="kafka_telemetry" checked> <span class="plan-route-uid">Kafka 遥测</span></label>
        <label class="plan-route-item" style="font-size:11px;"><input type="checkbox" class="log-type-cb" value="kafka_trace" checked> <span class="plan-route-uid">Kafka 轨迹预测</span></label>
        <label class="plan-route-item" style="font-size:11px;"><input type="checkbox" class="log-type-cb" value="db_run_data"> <span class="plan-route-uid">DB 运行日志</span></label>
        <label class="plan-route-item" style="font-size:11px;"><input type="checkbox" class="log-type-cb" value="db_traffic"> <span class="plan-route-uid">DB 流量日志</span></label>
        <label class="plan-route-item" style="font-size:11px;"><input type="checkbox" class="log-type-cb" value="db_alarm"> <span class="plan-route-uid">DB 告警日志</span></label>
        <label class="plan-route-item" style="font-size:11px;"><input type="checkbox" class="log-type-cb" value="sim_status" checked> <span class="plan-route-uid">仿真状态</span></label>
      </div>

      <!-- 底部控制区 -->
      <div style="margin-top:auto;padding:10px 12px;border-top:1px solid var(--border);">
        <input type="text" id="logs-search" placeholder="🔍 关键字过滤..."
               style="width:100%;box-sizing:border-box;background:#0d1b2a;border:1px solid var(--border);color:var(--accent-bright);padding:5px 8px;border-radius:4px;font-size:12px;">
        <div style="display:flex;flex-direction:column;gap:4px;margin-top:8px;">
          <button id="btn-logs-export-json" class="btn btn-small" style="width:100%;">📥 导出 JSON</button>
          <button id="btn-logs-export-csv" class="btn btn-small" style="width:100%;">📥 导出 CSV</button>
        </div>
      </div>
    </aside>

    <!-- 右侧：Tab 内容面板 -->
    <section class="panel" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <!-- 工具栏 -->
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0;">
        <h2 style="margin:0;font-size:15px;">📋 <span id="tab-title">监视目标</span></h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <button id="btn-logs-pause" class="btn btn-small">⏸ 暂停</button>
          <button id="btn-logs-clear" class="btn btn-small">🧹 清空</button>
          <button id="btn-logs-refresh" class="btn btn-small btn-refresh">🔄 刷新</button>
          <span id="logs-stats" style="font-size:11px;color:var(--text-dim);white-space:nowrap;"></span>
        </div>
      </div>

      <!-- 监视目标 Tab -->
      <div id="gentab-situation-uav" class="gen-tab-content active" style="flex:1;overflow-y:auto;padding:10px 14px;">
        <div id="logs-stream-uav"></div>
      </div>

      <!-- 飞行计划 Tab -->
      <div id="gentab-situation-plan" class="gen-tab-content" style="flex:1;overflow-y:auto;padding:10px 14px;">
        <div id="logs-stream-plan"></div>
      </div>

      <!-- 实时告警 Tab -->
      <div id="gentab-situation-alarm" class="gen-tab-content" style="flex:1;overflow-y:auto;padding:10px 14px;">
        <div id="logs-stream-alarm"></div>
      </div>

      <!-- 全部日志 Tab -->
      <div id="gentab-all" class="gen-tab-content" style="flex:1;overflow-y:auto;">
        <div id="logs-stream-all" class="log-stream"
             style="font-family:'Consolas',monospace;font-size:12px;height:100%;border:none;background:transparent;padding:6px 14px;"></div>
      </div>
    </section>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/logs.js"></script>
  <script>initCommon('/logs');</script>
</body>
</html>
