<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Evaluation Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            color: #333;
        }
        h1, h2, h3 {
            color: #2c3e50;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .file-upload {
            margin: 20px 0;
        }
        .upload-btn {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .upload-btn:hover {
            background-color: #2980b9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .error {
            color: #e74c3c;
        }
        .success {
            color: #27ae60;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Skill Evaluation Viewer</h1>
        
        <div class="section">
            <h2>Upload Evaluation Data</h2>
            <div class="file-upload">
                <input type="file" id="eval-file" accept=".json">
                <button class="upload-btn" onclick="loadEvaluation()">Load Evaluation</button>
            </div>
        </div>
        
        <div class="section">
            <h2>Evaluation Results</h2>
            <div id="result-container">
                <p>Please upload an evaluation JSON file to view the results.</p>
            </div>
        </div>
    </div>
    
    <script>
        function loadEvaluation() {
            const fileInput = document.getElementById('eval-file');
            const resultContainer = document.getElementById('result-container');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                resultContainer.innerHTML = '<p class="error">Please select a JSON file.</p>';
                return;
            }
            
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const evaluationData = JSON.parse(e.target.result);
                    displayEvaluation(evaluationData);
                } catch (error) {
                    resultContainer.innerHTML = '<p class="error">Invalid JSON file.</p>';
                }
            };
            
            reader.onerror = function() {
                resultContainer.innerHTML = '<p class="error">Error reading file.</p>';
            };
            
            reader.readAsText(file);
        }
        
        function displayEvaluation(data) {
            const resultContainer = document.getElementById('result-container');
            
            // Generate HTML
            let html = `
                <div class="result">
                    <h3>Skill Information</h3>
                    <p><strong>Skill Name:</strong> ${data.skill_name || 'Unknown'}</p>
                    <p><strong>Evaluation Date:</strong> ${data.evaluation_date || 'Unknown'}</p>
                    
                    <h3>Overall Score</h3>
                    <p class="score">${data.overall_score || 0}/10</p>
                    
                    <h3>Criteria Scores</h3>
                    <div class="criteria">
            `;
            
            // Add criteria
            if (data.criteria && data.criteria.length > 0) {
                data.criteria.forEach(criterion => {
                    html += `
                        <div class="criterion">
                            <span class="criterion-name">${criterion.name}:</span>
                            <span class="criterion-score">${criterion.score}/10</span>
                        </div>
                    `;
                });
            } else {
                html += '<p>No criteria data available.</p>';
            }
            
            // Add feedback
            html += `
                    </div>
                    
                    <h3>Feedback</h3>
                    <p>${data.feedback || 'No feedback available.'}</p>
                </div>
            `;
            
            resultContainer.innerHTML = html;
        }
    </script>
</body>
</html>
