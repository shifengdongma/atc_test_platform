# ATC/UTM 自动化测试平台 — Docker Compose 部署
#
# 快速部署：
#   1. cp docker/.env.example docker/.env && vim docker/.env
#   2. docker compose -f docker/docker-compose.yml up -d --build
#
# 停止：
#   docker compose -f docker/docker-compose.yml down
#
# 注意：
#   - 构建上下文 = 项目根目录（docker-compose.yml 的 context: ..）
#   - env.py 敏感配置通过卷挂载注入，不进镜像
#   - 首次部署前创建宿主机目录：mkdir -p /opt/utm-simulator/{data,logs}

services:
  # ── 主服务：UTM 无人机模拟器 Web 控制台 ─────────────
  utm-simulator:
    build:
      # 1Panel 将 compose 文件复制到 /opt/1panel/docker/compose/ 执行，
      # 因此 context 必须用绝对路径指向项目根目录，不能用相对路径 ..
      context: /opt/atc_test_platfrom
      dockerfile: docker/Dockerfile
      no_cache: true
    container_name: ${CONTAINER_NAME:-atc_test_platfrom}
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - WEB_HOST=0.0.0.0
      - WEB_PORT=5000
      - TZ=Asia/Shanghai
      # 日志格式：simple=仅可读文本，避免控制台双重输出
      - UTM_LOG_FORMAT=${UTM_LOG_FORMAT:-simple}
      # HTTP 请求日志级别：WARNING 抑制每次请求的刷屏
      - UTM_HTTP_LOG_LEVEL=${UTM_HTTP_LOG_LEVEL:-WARNING}
      # ── Redis 连接 ──────────────────────────────
      - UTM_REDIS_HOST=${UTM_REDIS_HOST}
      - UTM_REDIS_PORT=${UTM_REDIS_PORT:-21003}
      - UTM_REDIS_PASSWORD=${UTM_REDIS_PASSWORD:-}
      # ── Kafka 连接 ──────────────────────────────
      - UTM_KAFKA_URL=${UTM_KAFKA_URL}
      - UTM_KAFKA_URL2=${UTM_KAFKA_URL2:-}
      # ── 达梦数据库（dmPython）────────────────────
      - UTM_DM_HOST=${UTM_DM_HOST:-10.165.32.217}
      - UTM_DM_PORT=${UTM_DM_PORT:-5236}
      - UTM_DM_USER=${UTM_DM_USER:-SYSDBA}
      - UTM_DM_PASSWORD=${UTM_DM_PASSWORD:-}
      - UTM_DM_SCHEMA=${UTM_DM_SCHEMA:-ATC_DKWRJ_TEST}
      # ── MySQL 持久化 ────────────────────────────
      - UTM_MYSQL_HOST=${UTM_MYSQL_HOST:-}
      - UTM_MYSQL_PORT=${UTM_MYSQL_PORT:-3306}
      - UTM_MYSQL_USER=${UTM_MYSQL_USER:-}
      - UTM_MYSQL_PASSWORD=${UTM_MYSQL_PASSWORD:-}
      - UTM_MYSQL_DB=${UTM_MYSQL_DB:-utm_simulator}
      # ── ATC 端点 ────────────────────────────────
      - UTM_ATC_BASE_URL=${UTM_ATC_BASE_URL:-https://dkkgsit-test.testdolphin.com}
      # ── 详细日志开关（调试时设为 1）─────────────
      - UTM_VERBOSE=${UTM_VERBOSE:-0}
    volumes:
      # ── env.py 配置文件挂载 ─────────────────────
      # env.py 包含所有连接凭证，不在 git 仓库中，通过宿主机文件注入
      # 方式一：挂载宿主机 env.py（推荐）
      - ${ENV_PY_PATH:-/opt/atc_test_platfrom/env.py}:/app/env.py:ro
      # ── 数据持久化 ──────────────────────────────
      # JSON 数据文件（mock/ + uploads/ + templates/）
      - ${DATA_PATH:-/opt/utm-simulator/data}:/app/data
      # SQLite 数据库 + 日志（分离存储，不随镜像重建丢失）
      - ${DB_PATH:-/opt/utm-simulator/db}:/app/data/db
      - ${LOG_PATH:-/opt/utm-simulator/logs}:/app/logs
      # ── 时钟同步 ────────────────────────────────
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      - utm-net
      - 1panel-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ──（可选）本地 Redis 开发容器 ─────────────────────
  # 生产环境 Redis/Kafka 通常由外部提供，本地开发可取消注释
  # redis:
  #   image: redis:7-alpine
  #   container_name: utm-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped
  #   networks:
  #     - utm-net

networks:
  utm-net:
    driver: bridge
  1panel-network:
    external: true  # 1Panel 管理的外部网络（MySQL 等基础服务）
