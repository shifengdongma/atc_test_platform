# ATC/UTM 模拟器 — 配置文件模板（旧版 INI 格式，已弃用）
# 新版部署请使用 .env 文件 + docker-compose.yml 的 environment 注入
# 此文件保留作为配置字段参考

[DEFAULT]
# ── Redis 双集群 ─────────────────────────────────────
redis_ip_1 = 10.165.32.24
redis_port_1 = 26379
redis_password_1 = your_password_here

redis_ip_2 = 10.165.32.25
redis_port_2 = 26379
redis_password_2 = your_password_here

# ── Kafka 双集群 ─────────────────────────────────────
kafka_url_1 = 10.165.32.24:29092
kafka_url_2 = 10.165.32.25:29092

# ── 模拟器配置 ───────────────────────────────────────
TARGET_DRONES = 60

# ── 仿真核心参数 ─────────────────────────────────────
ORIGIN_LAT = 40.06295310528331
ORIGIN_LON = 116.58487961696733
RE_EARTH = 6371000.0
SIM_RADIUS_M = 5000.0
CLIMB_RATE = 15.0
CRUISE_SPEED = 30.0
MAX_HORIZ_ACCEL = 5.0
MAX_VERT_ACCEL = 5.0
