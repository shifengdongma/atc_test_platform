# ============================================
# 场景生成器 - 批量配置文件示例
# ============================================

output: "batch_scene.json"

scenes:
  # 示例1: 直线飞行
  - type: straight_line
    uid: "UAV_STRAIGHT_001"
    start_lon: 120.7000
    start_lat: 31.3100
    start_alt: 100
    speed: 15
    duration: 300
    heading: 90
    interval_ms: 1000

  # 示例2: 折线飞行
  - type: polyline
    uid: "UAV_POLY_001"
    start_lon: 120.7000
    start_lat: 31.3100
    start_alt: 100
    speed: 15
    interval_ms: 1000
    waypoints:
      - lon: 120.7050
        lat: 31.3150
        alt: 150
      - lon: 120.7100
        lat: 31.3100
        alt: 100
      - lon: 120.7150
        lat: 31.3150
        alt: 200

  # 示例3: 圆形飞行
  - type: circle
    uid: "UAV_CIRCLE_001"
    center_lon: 120.7000
    center_lat: 31.3100
    center_alt: 200
    speed: 15
    duration: 600
    radius: 500
    clockwise: true
    interval_ms: 1000

  # 示例4: 定点盘旋
  - type: hover
    uid: "UAV_HOVER_001"
    lon: 120.7000
    lat: 31.3100
    alt: 100
    duration: 300
    interval_ms: 1000

  # 示例5: 爬升后下降
  - type: ascent_descent
    uid: "UAV_AD_001"
    start_lon: 120.7000
    start_lat: 31.3100
    start_alt: 50
    speed: 15
    duration: 600
    target_alt: 500
    heading: 90
    interval_ms: 1000

  # 示例6: 8字形飞行
  - type: figure8
    uid: "UAV_F8_001"
    center_lon: 120.7000
    center_lat: 31.3100
    center_alt: 200
    speed: 15
    duration: 600
    radius: 500
    interval_ms: 1000

  # 示例7: 螺旋飞行（爬升）
  - type: spiral
    uid: "UAV_SPIRAL_001"
    center_lon: 120.7000
    center_lat: 31.3100
    start_alt: 100
    speed: 15
    duration: 600
    start_radius: 100
    end_radius: 1000
    turns: 3.0
    climb: true
    interval_ms: 1000
