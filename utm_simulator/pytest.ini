[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记定义
markers =
    kafka: 需要 Kafka 连接的测试（默认跳过）
    redis: 需要 Redis 连接的测试（默认跳过）
    slow: 慢速集成测试
    perf: 性能测试

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# 覆盖率
# pip install pytest-cov 后可用:
# addopts = --cov=. --cov-report=html --cov-report=term
