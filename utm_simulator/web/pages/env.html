<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>环境管理 — UTM 模拟器</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100; justify-content:center; align-items:center; }
    .modal-overlay.show { display:flex; }
    .modal { background:var(--bg-panel); border:1px solid var(--border); border-radius:8px; padding:20px; width:420px; max-height:80vh; overflow-y:auto; }
    .modal h3 { margin-bottom:12px; }
    .modal .form-row { display:flex; gap:8px; margin-bottom:10px; align-items:center; }
    .modal .form-row label { width:80px; font-size:12px; color:var(--text-dim); flex-shrink:0; text-align:right; }
    .modal .form-row input { flex:1; padding:6px 8px; background:#0d1b2a; border:1px solid var(--border); color:var(--text); border-radius:4px; font-size:13px; }
    .modal .form-row input:focus { border-color:var(--accent); outline:none; }
    .modal .btn-row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
    .current-badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:10px; background:rgba(46,204,113,0.2); color:var(--success); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left"><h1>🛩️ UTM 模拟器控制台</h1><span class="version">utm_moc52 v3.1</span></div>
    <nav class="topbar-nav" id="top-nav"></nav>
    <div class="topbar-right"><span id="connection-dot" class="dot red"></span><span id="connection-text">未连接</span></div>
  </header>

  <main class="page-wide">
    <div class="panel panel-form">
      <h2>🔧 环境配置管理</h2>
      <div class="mode-description" style="margin-bottom:12px;">
        管理 Redis/Kafka 连接地址，支持多环境保存与一键切换。当前激活环境的配置用于所有仿真操作。
      </div>

      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <button id="btn-env-new" class="btn btn-small">➕ 新建环境</button>
        <button id="btn-env-import" class="btn btn-small">📥 从 env.py 导入</button>
        <span id="env-status" style="font-size:12px;color:#82aaff;margin-left:8px;"></span>
      </div>

      <div style="max-height:400px;overflow-y:auto;">
        <table class="data-table" style="width:100%;font-size:12px;">
          <thead><tr><th>名称</th><th>Redis 地址</th><th>Kafka 地址</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="env-tbody"><tr><td colspan="5" class="empty-hint">加载中...</td></tr></tbody>
        </table>
      </div>

      <!-- 当前激活信息 -->
      <div id="current-info" style="margin-top:12px;padding:10px;background:var(--bg-card);border-radius:6px;font-size:12px;color:var(--text-dim);">
        <strong>当前激活：</strong>加载中...
      </div>
    </div>
  </main>

  <!-- 编辑弹窗 -->
  <div class="modal-overlay" id="env-modal">
    <div class="modal">
      <h3 id="modal-title">新建环境</h3>
      <div class="form-row"><label>名称 *</label><input type="text" id="ev-name" placeholder="例如：开发环境 / ATC测试 / 24号"></div>
      <div class="form-row"><label>Redis IP</label><input type="text" id="ev-redis-ip" value="127.0.0.1"></div>
      <div class="form-row"><label>Redis 端口</label><input type="text" id="ev-redis-port" value="6379"></div>
      <div class="form-row"><label>Redis 密码</label><input type="text" id="ev-redis-pwd" placeholder="无密码留空"></div>
      <div class="form-row"><label>Kafka 地址</label><input type="text" id="ev-kafka-url" value="127.0.0.1:9092"></div>
      <div class="form-row"><label>Kafka 镜像</label><input type="text" id="ev-kafka-url2" placeholder="可选，双写容灾用"></div>
      <div class="btn-row">
        <button id="btn-modal-cancel" class="btn btn-small">取消</button>
        <button id="btn-modal-save" class="btn btn-start">保存</button>
      </div>
    </div>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/env.js"></script>
  <script>initCommon('/env');</script>
</body>
</html>
