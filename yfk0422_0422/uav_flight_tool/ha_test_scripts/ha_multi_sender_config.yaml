# ============================================
# 高可用多点多组发送器 - 配置文件
# ============================================

# 配置说明：
# 1. clusters: 统一配置 Kafka/Redis 集群连接信息，避免重复
# 2. defaults: 全局默认参数，所有端点共享（可被端点单独覆盖）
# 3. endpoints: 端点列表，每个端点通过 cluster 字段引用集群，通过 enabled 开关控制是否启用

# ------------------- 集群配置 -------------------
clusters:
  cluster_a:
    kafka_url: "10.165.32.24:29092"
    redis_host: "10.165.32.24"
    redis_port: 26379
    redis_password: "s^mP2^qP7^sP"
    redis_db: 0

  cluster_b:
    kafka_url: "10.165.32.25:29092"
    redis_host: "10.165.32.25"
    redis_port: 26379
    redis_password: "sgW3^oA1^tL9"
    redis_db: 0

# ------------------- 默认参数 -------------------
# 所有端点共享以下默认值，端点可单独覆盖任意字段
defaults:
  topic: "uav_runtime_data"
  trace_topic: "uav_runtime_trace"
  interval_ms: 1000
  alive_mode: true
  consume_trace: true
  # 多线程仿真默认参数（参考 main_multi.py）
  num_workers: 15
  drone_count: 3000
  timestamp_offset_ms: -1000
  enable_worker_log: false

# ------------------- 端点配置 -------------------
endpoints:
  # 端点1: 场景文件模式，连接集群 A
  - name: "cluster_a_scene"
    cluster: "cluster_a"          # 引用 clusters.cluster_a
    data_source_type: "scene_file"
    scene_file: "../scenes/scene_cluster_a.json"
    enabled: true                 # true=启用, false=禁用

  # 端点2: 场景文件模式，连接集群 B
  - name: "cluster_b_scene"
    cluster: "cluster_b"
    data_source_type: "scene_file"
    scene_file: "../scenes/scene_cluster_b.json"
    enabled: true

  # 端点3: 仿真模式，连接集群 A
  - name: "cluster_a_sim"
    cluster: "cluster_a"
    data_source_type: "simulation"
    # drone_count: 3000  # 使用 defaults 默认值
    # num_workers: 15   # 使用 defaults 默认值
    enabled: false

  # 端点4: 仿真模式，连接集群 B
  - name: "cluster_b_sim"
    cluster: "cluster_b"
    data_source_type: "simulation"
    drone_count: 60
    enabled: false                # 默认禁用，需要时改为 true
