# ============================================
# 场景配置: 编队飞行
# ============================================

name: "编队飞行"
description: "两架无人机编队飞行测试"

# UAV 配置列表
# 每个 UAV 对应一个 JSON 数据文件
uavs:
  - file: "1.json"
    enabled: true        # 是否发射（默认 true）
    # delay_ms: 0          # 延迟发射（毫秒）
    
  - file: "2.json"
    enabled: true
    
  - file: "3.json"
    enabled: true

# 场景参数（可选，用于文档说明）
params:
  formation_type: "parallel"
  distance: 50
