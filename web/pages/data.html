<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据管理 — UTM 模拟器</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" async></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="page-data">
  <header class="topbar">
    <div class="topbar-left"><h1>🛩️ UTM 模拟器控制台</h1></div>
    <nav class="topbar-nav" id="top-nav"></nav>
    <div class="topbar-right"><span id="connection-dot" class="dot red"></span><span id="connection-text">未连接</span></div>
  </header>

  <div class="app-layout">
    <aside id="left-sidebar"></aside>

    <main class="page-data-main">
      <div class="panel panel-form page-data-panel">
        <h2>📁 JSON 数据管理</h2>
        <div class="mode-description" style="margin-bottom:8px;">
          管理模拟数据 JSON 文件，支持数据库存储、分类检索、上传下载。mock/ 目录中的现有文件可一键导入。
        </div>

        <!-- 工具栏 -->
        <div class="data-toolbar">
          <input type="text" id="data-search" placeholder="🔍 搜索文件名/描述..." class="data-search-input">
          <select id="data-category" class="data-filter-select">
            <option value="">全部分类</option>
          </select>
          <select id="data-alarm-type" class="data-filter-select">
            <option value="">全部告警类型</option>
          </select>
          <button id="btn-category-manage" class="btn btn-small" title="管理分类">📂 分类</button>
          <button id="btn-alarm-type-manage" class="btn btn-small" title="管理告警类型">🏷️ 告警</button>
          <button id="btn-data-refresh" class="btn btn-small">🔄 刷新</button>
          <button id="btn-data-upload" class="btn btn-small">📤 上传 JSON</button>
          <button id="btn-data-import" class="btn btn-small">📥 导入 mock/</button>
          <button id="btn-data-new" class="btn btn-small">➕ 新建</button>
          <input type="file" id="file-upload-input" accept=".json" style="display:none;">
        </div>

        <!-- 文件列表 — 新列顺序 -->
        <div class="data-table-wrapper">
          <table class="data-table" style="width:100%;font-size:12px;">
            <thead>
              <tr>
                <th style="width:50px;">ID</th>
                <th style="width:90px;">告警类型</th>
                <th style="width:110px;">操作</th>
                <th style="width:130px;">模拟器ID</th>
                <th style="width:110px;">关联航线</th>
                <th>文件名</th>
                <th style="width:70px;">大小</th>
                <th style="width:70px;">来源</th>
                <th style="width:85px;">更新时间</th>
              </tr>
            </thead>
            <tbody id="data-tbody"><tr><td colspan="9" class="empty-hint">加载中...</td></tr></tbody>
          </table>
        </div>

        <!-- 分页 -->
        <div id="data-pagination" class="data-pagination-bar"></div>

        <!-- 文件预览 -->
        <div class="data-preview-section">
          <div class="data-preview-header">
            <label>文件内容预览</label>
            <div class="data-preview-actions">
              <button id="btn-preview-load-more" class="btn btn-small" style="display:none;">📄 加载更多</button>
              <button id="btn-preview-download" class="btn btn-small" disabled>⬇ 下载</button>
              <button id="btn-preview-export" class="btn btn-small" disabled>📤 导出到 mock/</button>
              <button id="btn-preview-close" class="btn btn-small">✕ 关闭预览</button>
            </div>
          </div>
          <div id="data-preview" class="data-preview">
            <div class="empty-hint">选择文件以预览内容</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 分类管理弹窗 -->
  <div id="category-modal" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;justify-content:center;align-items:center;">
    <div class="modal" style="background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:20px;width:420px;max-height:70vh;overflow-y:auto;">
      <h3 style="margin-bottom:12px;">📂 管理分类</h3>
      <div style="display:flex;gap:6px;margin-bottom:10px;">
        <input type="text" id="new-category-name" placeholder="输入新分类名称" style="flex:1;padding:6px 8px;background:#0d1b2a;border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:13px;">
        <button id="btn-category-add" class="btn btn-small">➕ 添加</button>
      </div>
      <div id="category-list" style="max-height:300px;overflow-y:auto;">
        <div class="empty-hint">加载中...</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
        <button id="btn-category-modal-close" class="btn btn-small">关闭</button>
      </div>
    </div>
  </div>

  <!-- 告警类型管理弹窗 -->
  <div id="alarm-type-modal" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;justify-content:center;align-items:center;">
    <div class="modal" style="background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:20px;width:480px;max-height:75vh;overflow-y:auto;">
      <h3 style="margin-bottom:12px;">🏷️ 管理告警类型</h3>
      <div style="display:flex;gap:6px;margin-bottom:10px;">
        <input type="text" id="new-alarm-type-name" placeholder="告警类型名称" style="flex:1;padding:6px 8px;background:#0d1b2a;border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:13px;">
        <input type="color" id="new-alarm-type-color" value="#64748b" style="width:36px;height:32px;padding:0;border:1px solid var(--border);border-radius:4px;cursor:pointer;" title="颜色">
        <button id="btn-alarm-type-add" class="btn btn-small">➕ 添加</button>
      </div>
      <div id="alarm-type-list" style="max-height:320px;overflow-y:auto;">
        <div class="empty-hint">加载中...</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
        <button id="btn-alarm-type-modal-close" class="btn btn-small">关闭</button>
      </div>
    </div>
  </div>

  <!-- 编辑/新建弹窗 -->
  <div id="edit-modal" class="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;justify-content:center;align-items:center;">
    <div class="modal" style="background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:20px;width:550px;max-height:85vh;overflow-y:auto;">
      <h3 id="edit-modal-title">新建 JSON 文件</h3>
      <div style="margin-bottom:10px;"><label style="font-size:12px;color:var(--text-dim);">文件名 *</label><input type="text" id="edit-name" style="width:100%;padding:6px 8px;background:#0d1b2a;border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:13px;"></div>
      <div style="display:flex;gap:10px;margin-bottom:10px;">
        <div style="flex:1;"><label style="font-size:12px;color:var(--text-dim);">分类</label><input type="text" id="edit-category" list="category-datalist" style="width:100%;padding:6px 8px;background:#0d1b2a;border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:13px;" placeholder="输入或选择分类"><datalist id="category-datalist"></datalist></div>
        <div style="flex:1;"><label style="font-size:12px;color:var(--text-dim);">告警类型</label><select id="edit-alarm-type" style="width:100%;padding:6px 8px;background:#0d1b2a;border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:13px;"><option value="">自动检测</option></select></div>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:10px;">
        <div style="flex:1;"><label style="font-size:12px;color:var(--text-dim);">模拟器ID</label><input type="text" id="edit-simulator-id" style="width:100%;padding:6px 8px;background:#0d1b2a;border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:13px;" placeholder="无人机唯一标识"></div>
        <div style="flex:1;"><label style="font-size:12px;color:var(--text-dim);">关联航线</label><input type="text" id="edit-linked-route" style="width:100%;padding:6px 8px;background:#0d1b2a;border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:13px;" placeholder="关联的航线名称"></div>
      </div>
      <div style="margin-bottom:10px;"><label style="font-size:12px;color:var(--text-dim);">描述</label><input type="text" id="edit-desc" style="width:100%;padding:6px 8px;background:#0d1b2a;border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:13px;"></div>
      <div style="margin-bottom:10px;">
        <label style="font-size:12px;color:var(--text-dim);">JSON 内容 <span id="edit-size-warning" style="color:var(--danger);display:none;">⚠ 文件较大，建议使用上传功能</span></label>
        <textarea id="edit-content" rows="10" style="width:100%;padding:6px 8px;background:#0d1b2a;border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:12px;font-family:Consolas,monospace;resize:vertical;" placeholder='[{...}] 或 {"key":...}'></textarea>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button id="btn-edit-cancel" class="btn btn-small">取消</button>
        <button id="btn-edit-save" class="btn btn-start">保存</button>
      </div>
    </div>
  </div>

  <script src="/static/js/common.js" defer></script>
  <script src="/static/js/data.js" defer></script>
</body>
</html>
