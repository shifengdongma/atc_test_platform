# ATC/UTM 自动化测试平台 — Docker Compose 部署
# 启动：docker compose -f docker/docker-compose.yml up -d
# 停止：docker compose -f docker/docker-compose.yml down

# version: '3.8'

services:
  # ── 主服务：UTM 无人机模拟器 Web 控制台 ─────────────
  utm-simulator:
    build:
      context: /opt/atc_test_platfrom
      dockerfile: docker/Dockerfile
      no_cache: true
    # image: utm-simulator:${TAG:-latest}
    container_name: utm-simulator
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - TZ=Asia/Shanghai
      # 日志格式：simple=仅可读文本，避免 JSON+文本双重输出
      - UTM_LOG_FORMAT=simple
      # HTTP 请求日志级别：WARNING 抑制每次请求的 INFO 日志刷屏
      - UTM_HTTP_LOG_LEVEL=WARNING
      # Redis 连接（通过环境变量注入，覆盖 env.py 默认值）
      - UTM_REDIS_HOST=${UTM_REDIS_HOST}
      - UTM_REDIS_PORT=${UTM_REDIS_PORT:-21003}
      - UTM_REDIS_PASSWORD=${UTM_REDIS_PASSWORD:-}
      # Kafka 连接
      - UTM_KAFKA_URL=${UTM_KAFKA_URL}
      - UTM_KAFKA_URL2=${UTM_KAFKA_URL2:-}
      # 达梦数据库（dmPython 连接配置，env.py 挂载失败时兜底）
      - UTM_DM_HOST=${UTM_DM_HOST:-10.165.32.32}
      - UTM_DM_PORT=${UTM_DM_PORT:-5237}
      - UTM_DM_USER=${UTM_DM_USER:-SYSDBA}
      - UTM_DM_PASSWORD=${UTM_DM_PASSWORD:-}
      - UTM_DM_SCHEMA=${UTM_DM_SCHEMA:-ATC_DKWRJ_TEST}
      # MySQL 日志持久化
      # 容器内连接 1Panel 管理的 MySQL 服务（1Panel-mysql-Jdmq:3306）
      # 宿主机外部连接使用 127.0.0.1:3306
      - UTM_MYSQL_HOST=${UTM_MYSQL_HOST:-}
      - UTM_MYSQL_PORT=${UTM_MYSQL_PORT:-3306}
      - UTM_MYSQL_USER=${UTM_MYSQL_USER:-}
      - UTM_MYSQL_PASSWORD=${UTM_MYSQL_PASSWORD:-}
      - UTM_MYSQL_DB=${UTM_MYSQL_DB:-}
      # ATC 端点
      - UTM_ATC_BASE_URL=${UTM_ATC_BASE_URL:-https://dkkgsit-test.testdolphin.com}
    volumes:
      # 配置文件（env.py 等敏感文件不在仓库中，从宿主机挂载）
      - /opt/atc_test_platfrom/utm_simulator/env.py:/app/utm_simulator/env.py:ro
      # 达梦数据库配置（dmdbclient.py 需要 atc_api_autotest/env.py，含 DB_HOST 等）
      - /opt/atc_test_platfrom/atc_api_autotest/env.py:/app/atc_api_autotest/env.py:ro
      #- ${ENV_PY_PATH:-./env.py}:/app/utm_simulator/env.py:ro
      # SQLite 数据持久化
      - /opt/utm-simulator/data:/app/utm_simulator/data
      # JSON 数据文件持久化（mock/ + uploads/ + templates/）
      - /opt/atc_test_platfrom/data:/app/data
      # ── ⚠ 命名卷陷阱 ─────────────────────────────────
      # 命名卷首次创建时从镜像复制 /app/database/ 内容，之后永久保留。
      # 镜像重建后，卷中旧 .py 文件会覆盖镜像中的新代码！
      # 如果出现 AttributeError (如 "no attribute 'query_available_routes'")，
      # 说明卷中代码过旧，必须删除卷重建：
      #   docker compose down
      #   docker volume rm atc_test_platfrom_utm-database
      #   docker compose build --no-cache && docker compose up -d
      #
      # 长期方案：将 SQLite 数据分离到 /app/data/db/，代码目录不再使用卷。
      # ──────────────────────────────────────────────────
      - utm-database:/app/database
      # 日志持久化
      - /opt/utm-simulator/logs:/app/utm_simulator/logs
      # 时钟同步（只读）
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      - utm-net
      - 1panel-network  # 连接 1Panel 管理的 MySQL 容器
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ──（可选）本地 Redis 开发容器 ─────────────────────
  # 生产环境 Redis 由外部提供，本地开发可取消注释
  # redis:
  #   image: redis:7-alpine
  #   container_name: utm-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - ./redis-data:/data
  #   restart: unless-stopped
  #   networks:
  #     - utm-net

networks:
  utm-net:
    driver: bridge
  1panel-network:
    external: true  # 1Panel 管理的外部网络（MySQL 等基础服务）

volumes:
  # ╔══════════════════════════════════════════════════════════════╗
  # ║  ⚠ 重要：此命名卷持久化 /app/database/ 目录（含 .py 源文件）║
  # ║  镜像重建后旧代码会覆盖新代码，更新代码前必须删除此卷！    ║
  # ║  详见上方 volumes 挂载处的注释。                           ║
  # ╚══════════════════════════════════════════════════════════════╝
  utm-database:
