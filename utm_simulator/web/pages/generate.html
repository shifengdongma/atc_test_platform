<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据生成 — UTM 模拟器</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left"><h1>🛩️ UTM 模拟器控制台</h1><span class="version">utm_moc52 v3.1</span></div>
    <nav class="topbar-nav" id="top-nav"></nav>
    <div class="topbar-right"><span id="connection-dot" class="dot red"></span><span id="connection-text">未连接</span></div>
  </header>

  <main class="page-wide">
    <div class="panel panel-form">
      <h2>📊 模拟数据生成</h2>
      <div class="gen-tabs">
        <button class="gen-tab active" data-gentab="basic">基础生成</button>
        <button class="gen-tab" data-gentab="single">单机场景</button>
        <button class="gen-tab" data-gentab="multi">多机场景</button>
        <button class="gen-tab" data-gentab="batch">批量预设</button>
      </div>

      <!-- 基础生成 -->
      <div class="gen-tab-content active" id="gentab-basic">
        <div class="form-group"><label>⚡ 快速生成模拟数据（Simulator引擎）</label></div>
        <div class="gen-form">
          <div class="form-row"><label>架数:</label><input type="number" id="gen-count" value="10" min="1" max="5000"></div>
          <div class="form-row"><label>中心纬度:</label><input type="number" id="gen-lat" value="31.315" step="0.001"></div>
          <div class="form-row"><label>中心经度:</label><input type="number" id="gen-lon" value="120.665" step="0.001"></div>
          <div class="form-row"><label>半径(m):</label><input type="number" id="gen-radius" value="800" min="100" max="50000"></div>
          <div class="form-row"><label>模式:</label><select id="gen-pattern"><option value="random">随机散点</option><option value="grid">网格分布</option><option value="radial">放射状</option></select></div>
          <div class="form-row"><label>飞行时长(min):</label><input type="number" id="gen-duration" value="10" min="1" max="120"></div>
          <button id="btn-generate" class="btn btn-start" style="width:100%;">⚡ 生成数据</button>
          <span id="gen-result" style="font-size:12px;margin-top:4px;"></span>
        </div>
      </div>

      <!-- 单机场景 -->
      <div class="gen-tab-content" id="gentab-single">
        <div class="sub-tabs">
          <button class="sub-tab active" data-subtab="route">航线飞行</button>
          <button class="sub-tab" data-subtab="deviate">偏离航路</button>
          <button class="sub-tab" data-subtab="status">状态变更</button>
        </div>
        <div class="sub-tab-content active" id="subtab-route">
          <div class="gen-form">
            <div class="form-row"><label>UID:</label><input type="text" id="s-uid" value="UAV_TEST_001"></div>
            <div class="form-row"><label>途经点(可选):</label><input type="text" id="s-points" placeholder="lon,lat,alt;..." style="width:100%"></div>
            <div class="form-row"><label>起点经度:</label><input type="number" id="s-start-lon" step="0.0001"></div>
            <div class="form-row"><label>起点纬度:</label><input type="number" id="s-start-lat" step="0.0001"></div>
            <div class="form-row"><label>终点经度:</label><input type="number" id="s-end-lon" step="0.0001"></div>
            <div class="form-row"><label>终点纬度:</label><input type="number" id="s-end-lat" step="0.0001"></div>
            <div class="form-row"><label>高度(m):</label><input type="number" id="s-altitude" value="30" step="1"></div>
            <div class="form-row"><label>速度(m/s):</label><input type="number" id="s-speed" value="15" step="0.1"></div>
            <div class="form-row"><label>采样间隔(ms):</label><input type="number" id="s-interval" value="1000" step="100"></div>
            <button id="btn-gen-single-route" class="btn btn-start" style="width:100%;">🛩️ 生成单机航线</button>
            <span id="gen-single-result" style="font-size:12px;margin-top:4px;"></span>
          </div>
        </div>
        <div class="sub-tab-content" id="subtab-deviate">
          <div class="gen-form">
            <div class="form-row"><label>UID:</label><input type="text" id="sd-uid" value="UAV_DEVIATE_001"></div>
            <div class="form-row"><label>途经点:</label><input type="text" id="sd-points" placeholder="lon,lat,alt;..." style="width:100%"></div>
            <div class="form-row" style="display:flex;gap:4px;"><div style="flex:1"><label>起点经度</label><input type="number" id="sd-start-lon" step="0.0001" style="width:100%"></div><div style="flex:1"><label>起点纬度</label><input type="number" id="sd-start-lat" step="0.0001" style="width:100%"></div></div>
            <div class="form-row" style="display:flex;gap:4px;"><div style="flex:1"><label>终点经度</label><input type="number" id="sd-end-lon" step="0.0001" style="width:100%"></div><div style="flex:1"><label>终点纬度</label><input type="number" id="sd-end-lat" step="0.0001" style="width:100%"></div></div>
            <div class="form-row"><label>高度(m):</label><input type="number" id="sd-altitude" value="30" step="1"></div>
            <div class="form-row"><label>速度(m/s):</label><input type="number" id="sd-speed" value="15" step="0.1"></div>
            <div class="form-row"><label>偏离量(度):</label><input type="number" id="sd-deviate-offset" value="0.001" step="0.0001"></div>
            <div class="form-row"><label>偏离起始点:</label><input type="number" id="sd-deviate-start" value="5" min="0"></div>
            <button id="btn-gen-single-deviate" class="btn btn-start" style="width:100%;">↗️ 生成偏离航线</button>
            <span id="gen-deviate-result" style="font-size:12px;margin-top:4px;"></span>
          </div>
        </div>
        <div class="sub-tab-content" id="subtab-status">
          <div class="gen-form">
            <div class="form-row"><label>UID:</label><input type="text" id="ss-uid" value="UAV_STATUS_001"></div>
            <div class="form-row"><label>途经点:</label><input type="text" id="ss-points" placeholder="lon,lat,alt;..." style="width:100%"></div>
            <div class="form-row"><label>初始状态:</label><select id="ss-oper-status"><option value="2">飞行中</option><option value="1">已落地</option></select></div>
            <div class="form-row"><label>变更时间(ms):</label><input type="number" id="ss-change-time" value="5000" step="1000"></div>
            <div class="form-row"><label>变更后状态:</label><select id="ss-oper-status-changed"><option value="1">已落地</option><option value="2">飞行中</option></select></div>
            <button id="btn-gen-status-change" class="btn btn-start" style="width:100%;">📊 生成状态变更数据</button>
            <span id="gen-status-result" style="font-size:12px;margin-top:4px;"></span>
          </div>
        </div>
      </div>

      <!-- 多机场景 -->
      <div class="gen-tab-content" id="gentab-multi">
        <div class="sub-tabs">
          <button class="sub-tab active" data-subtab="parallel">平行飞行</button>
          <button class="sub-tab" data-subtab="deviate-adv">偏离(高级)</button>
          <button class="sub-tab" data-subtab="collision">碰撞预警</button>
          <button class="sub-tab" data-subtab="alert">状态告警</button>
        </div>
        <div class="sub-tab-content active" id="subtab-parallel">
          <div class="gen-form">
            <div class="form-row"><label>架数:</label><input type="number" id="mp-count" value="30" min="1" max="2000"></div>
            <div class="form-row"><label>中心纬度:</label><input type="number" id="mp-center-lat" value="40.818724" step="0.0001"></div>
            <div class="form-row"><label>中心经度:</label><input type="number" id="mp-center-lng" value="85.070136" step="0.0001"></div>
            <div class="form-row"><label>高度(m):</label><input type="number" id="mp-altitude" value="50" step="1"></div>
            <div class="form-row"><label>速度(m/s):</label><input type="number" id="mp-speed" value="15" step="0.1"></div>
            <div class="form-row"><label>航向(°):</label><input type="number" id="mp-heading" value="90" step="1"><small style="color:#7a93a8;">0=北 90=东</small></div>
            <div class="form-row"><label>间距(m):</label><input type="number" id="mp-spacing" value="2000" step="100"></div>
            <div class="form-row"><label>布局:</label><select id="mp-layout"><option value="hex">六边形</option><option value="line">直线</option></select></div>
            <button id="btn-gen-parallel" class="btn btn-start" style="width:100%;">🚁 生成平行飞行数据</button>
            <span id="gen-parallel-result" style="font-size:12px;margin-top:4px;"></span>
          </div>
        </div>
        <div class="sub-tab-content" id="subtab-deviate-adv">
          <div class="gen-form">
            <div class="form-row"><label>航线名:</label><input type="text" id="da-route-name" value="铁门关至吐鲁番"></div>
            <div class="form-row"><label>偏离量(m):</label><input type="number" id="da-deviate-offset" value="3000" step="100"></div>
            <div class="form-row"><label>偏离起始(s):</label><input type="number" id="da-deviate-start" value="20" step="1"></div>
            <div class="form-row"><label>偏离模式:</label><select id="da-deviate-mode"><option value="horizontal">水平</option><option value="vertical">垂直</option><option value="both">同时</option></select></div>
            <button id="btn-gen-deviate-adv" class="btn btn-start" style="width:100%;">↗️ 生成高级偏离数据</button>
            <span id="gen-deviate-adv-result" style="font-size:12px;margin-top:4px;"></span>
          </div>
        </div>
        <div class="sub-tab-content" id="subtab-collision">
          <div class="gen-form">
            <div class="form-row"><label>航线名(逗号分隔2条):</label><input type="text" id="col-route-names" value="跨顺义三河段,三河区航路"></div>
            <div class="form-row"><label>UID(逗号分隔2个):</label><input type="text" id="col-uids" value="CW000000000000000004,CH000000000000000003"></div>
            <div class="form-row"><label>相遇阈值(m):</label><input type="number" id="col-meeting-threshold" value="10" step="1"></div>
            <div class="form-row"><label>碰撞时间(s):</label><input type="number" id="col-collision-time" value="300" step="10"></div>
            <button id="btn-gen-collision" class="btn btn-start" style="width:100%;">💥 生成碰撞预警场景</button>
            <span id="gen-collision-result" style="font-size:12px;margin-top:4px;"></span>
          </div>
        </div>
        <div class="sub-tab-content" id="subtab-alert">
          <div class="gen-form">
            <div class="form-row"><label>架数:</label><input type="number" id="sa-count" value="1" min="1" max="100"></div>
            <div class="form-row"><label>飞行时长(min):</label><input type="number" id="sa-flight-min" value="1" step="1"></div>
            <div class="form-row"><label><input type="checkbox" id="sa-scene3"> 紧急后恢复(status=3)</label></div>
            <div class="form-row"><label><input type="checkbox" id="sa-scene5"> 失联(status=5)</label></div>
            <div class="form-row"><label><input type="checkbox" id="sa-scene35"> 紧急→失联(status=3→5)</label></div>
            <button id="btn-gen-status-alert" class="btn btn-start" style="width:100%;">🚨 生成状态告警场景</button>
            <span id="gen-status-alert-result" style="font-size:12px;margin-top:4px;"></span>
          </div>
        </div>
      </div>

      <!-- 批量预设 -->
      <div class="gen-tab-content" id="gentab-batch">
        <div class="form-group"><label>📦 一键批量生成（11个全国区域预设）</label></div>
        <div id="batch-preset-list" class="batch-grid"><div class="empty-hint">加载预设中...</div></div>
        <button id="btn-gen-batch-all" class="btn btn-start" style="width:100%;margin-top:8px;">🚀 一键生成全部预设</button>
        <span id="gen-batch-result" style="font-size:12px;margin-top:4px;"></span>
      </div>
    </div>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/generate.js"></script>
  <script>initCommon('/generate');</script>
</body>
</html>
