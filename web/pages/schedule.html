<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定时任务 — UTM 模拟器</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .task-card { background:var(--bg-card); border-radius:6px; padding:10px 12px; margin-bottom:6px; border-left:3px solid var(--accent); }
    .task-card h4 { font-size:13px; color:#82aaff; margin:0 0 4px 0; }
    .task-card .meta { font-size:11px; color:var(--text-dim); }
    .task-card .actions { margin-top:6px; display:flex; gap:4px; }
    .schedule-layout { display:grid; grid-template-columns:1.2fr 1fr; gap:16px; }
    @media (max-width:900px) { .schedule-layout { grid-template-columns:1fr; } }
  </style>
</head>
<body class="page-schedule">
  <header class="topbar">
    <div class="topbar-left">
      <h1>🛩️ UTM 模拟器控制台</h1>
      <span class="version">utm_moc52 v3.1</span>
    </div>
    <nav class="topbar-nav" id="top-nav"></nav>
    <div class="topbar-right">
      <span id="connection-dot" class="dot red"></span>
      <span id="connection-text">未连接</span>
    </div>
  </header>

  <div class="app-layout">
    <aside id="left-sidebar"></aside>

    <main class="page-wide">
      <div class="schedule-layout">
        <!-- ★ 左栏：新建定时任务表单 ★ -->
        <div class="panel-form">
          <h2 id="task-form-title">➕ 新建定时任务</h2>
          <!-- 模式切换 -->
          <div class="form-row" style="margin-bottom:10px;">
            <button id="btn-mode-single" class="btn" style="background:var(--accent);color:#fff;">📋 单个添加</button>
            <button id="btn-mode-batch" class="btn" style="background:var(--bg-card);color:var(--text-dim);">📑 批量添加</button>
          </div>
          <!-- 单个添加表单 -->
          <div class="task-inline-form" id="task-inline-form">
            <div class="form-row">
              <label>任务名称 *</label>
              <input type="text" id="tk-name" placeholder="例如：每日航线注入" style="flex:1;">
            </div>
            <div class="form-row">
              <label>仿真模式</label>
              <select id="tk-mode" style="flex:1;">
                <option value="replay">🔁 预生成回放(循环)</option>
                <option value="replay_once">▶️ 预生成回放(单次)</option>
                <option value="plan">📐 Redis计划插值</option>
                <option value="dynamic">🎮 动态仿真</option>
                <option value="scene">🎬 场景文件注入</option>
              </select>
              <label style="margin-left:8px;">架数</label>
              <input type="number" id="tk-drones" value="10" min="1" max="5000" style="width:70px;">
            </div>
            <div class="form-row">
              <label>数据文件</label>
              <select id="tk-json-file" style="flex:1;"><option value="">— 使用默认文件 —</option></select>
              <button id="btn-tk-refresh-files" class="btn btn-small" style="flex-shrink:0;">🔄</button>
            </div>
            <div class="form-row">
              <label>执行日期 *</label>
              <input type="date" id="tk-date" style="flex:1;">
              <label style="margin-left:8px;">时间 *</label>
              <input type="time" id="tk-time" value="09:00" style="flex:1;">
            </div>
            <div class="form-row">
              <label>重复方式</label>
              <select id="tk-repeat" style="flex:1;">
                <option value="once">仅一次</option>
                <option value="daily">每天</option>
                <option value="weekly">每周</option>
                <option value="monthly">每月</option>
              </select>
              <label style="margin-left:8px;"><input type="checkbox" id="tk-enabled" checked> 启用</label>
            </div>
            <div class="form-row" style="justify-content:flex-end;gap:8px;">
              <button id="btn-task-cancel-edit" class="btn btn-small" style="display:none;">取消编辑</button>
              <button id="btn-task-save" class="btn btn-start" style="padding:6px 20px;">保存</button>
            </div>
            <input type="hidden" id="tk-edit-id" value="">
          </div>
          <!-- 批量添加表格区域 -->
          <div id="batch-form-area" style="display:none;">
            <div style="max-height:380px;overflow-y:auto;margin-bottom:8px;">
              <table id="batch-table" style="width:100%;font-size:11px;border-collapse:collapse;">
                <thead>
                  <tr style="background:var(--bg-card);">
                    <th style="padding:4px;width:20px;">#</th>
                    <th style="padding:4px;">任务名称</th>
                    <th style="padding:4px;">JSON文件</th>
                    <th style="padding:4px;">模式</th>
                    <th style="padding:4px;">日期</th>
                    <th style="padding:4px;">时间</th>
                    <th style="padding:4px;">重复</th>
                    <th style="padding:4px;width:30px;">操作</th>
                  </tr>
                </thead>
                <tbody id="batch-tbody"></tbody>
              </table>
            </div>
            <div class="form-row" style="justify-content:space-between;">
              <button id="btn-batch-add-row" class="btn btn-small">➕ 添加一行</button>
              <button id="btn-batch-save" class="btn btn-start" style="padding:6px 20px;">💾 批量保存</button>
            </div>
          </div>
        </div>

        <!-- ★ 右栏：定时任务列表 + 执行历史 ★ -->
        <div class="panel-form">
          <h2>⏰ 定时任务</h2>
          <div id="task-list" style="max-height:350px;overflow-y:auto;">
            <div class="empty-hint">暂无定时任务</div>
          </div>

          <div class="form-group" style="margin-top:12px;">
            <label>最近执行记录</label>
            <div id="task-history" style="font-size:11px;color:var(--text-dim);max-height:120px;overflow-y:auto;">
              <div class="empty-hint">—</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/schedule.js"></script>
  <script>initCommon('/schedule');</script>
</body>
</html>
