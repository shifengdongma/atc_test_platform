<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仿真执行 — UTM 模拟器</title>
  <link rel="stylesheet" href="/static/lib/leaflet/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="/static/lib/leaflet/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1>🛩️ UTM 模拟器控制台</h1>
      <span class="version">utm_moc52 v3.1</span>
    </div>
    <nav class="topbar-nav" id="top-nav"></nav>
    <div class="topbar-right">
      <span id="connection-dot" class="dot red"></span>
      <span id="connection-text">未连接</span>
      <span class="separator">|</span>
      <span id="sim-status-badge" class="badge stopped">已停止</span>
    </div>
  </header>

  <main class="dashboard-run">
    <!-- 左侧：监控面板 -->
    <aside class="panel panel-monitor" id="panel-monitor">
      <h2>📊 实时监控</h2>
      <div class="status-cards">
        <div class="card"><div class="card-label">Redis</div><div class="card-value"><span id="ind-redis" class="indicator red"></span><span id="redis-status">未连接</span></div></div>
        <div class="card"><div class="card-label">Kafka</div><div class="card-value"><span id="ind-kafka" class="indicator red"></span><span id="kafka-status">未连接</span></div></div>
        <div class="card"><div class="card-label">活跃无人机</div><div class="card-value big" id="drones-count">0</div></div>
        <div class="card"><div class="card-label">Kafka 吞吐</div><div class="card-value big" id="kafka-tp">0 <small>条/秒</small></div></div>
        <div class="card"><div class="card-label">运行时长</div><div class="card-value big" id="uptime">00:00:00</div></div>
        <div class="card"><div class="card-label">错误计数</div><div class="card-value" id="error-count">0</div></div>
      </div>
      <div class="charts-row">
        <div class="chart-box"><canvas id="chart-drones"></canvas></div>
        <div class="chart-box"><canvas id="chart-kafka"></canvas></div>
      </div>
      <div class="log-panel">
        <h3>📋 运行日志 <button id="btn-export-log" class="btn btn-small" style="margin-left:8px;">📥 导出</button></h3>
        <div class="log-stream" id="log-stream"><div class="log-empty">等待日志...</div></div>
      </div>
    </aside>

    <!-- 右侧：地图 -->
    <section class="panel panel-map" id="panel-map">
      <h2>🗺️ 飞行计划可视化</h2>
      <div class="map-toolbar">
        <button id="btn-load-plans" class="btn btn-small">📡 加载航线</button>
        <button id="btn-load-nfzs" class="btn btn-small">🚫 加载禁飞区</button>
        <button id="btn-clear-map" class="btn btn-small">🧹 清除</button>
        <span id="map-stats" style="font-size:12px;color:#8899aa;margin-left:8px;"></span>
      </div>
      <div id="map-container"><div id="map-loading">🗺️ 地图加载中...</div></div>
      <div id="map-legend" class="map-legend"></div>
    </section>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/charts.js"></script>
  <script src="/static/js/map.js"></script>
  <script src="/static/js/run.js"></script>
  <script>initCommon('/run');</script>
</body>
</html>
